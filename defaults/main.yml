---
dnsmasq_configure_privilege_escalate: true

# to activate or not the dnsmasq service
dnsmasq_configure_activate: true

# disable the systemd-resolved service when activating dnsmasq
# to prevent them from crashing into each other
dnsmasq_configure_disable_systemd_resolved: false

# defaults file for dnsmasq-configure
# dnsmasq_configure_conf_dir: /etc
# dnsmasq_configure_conf_filename: dnsmasq.conf

# Listen on this specific port instead of the standard DNS port
# (53). Setting this to zero completely disables DNS function,
# leaving only DHCP and/or TFTP.
#dnsmasq_configure_port: 5353

# The following two options make you a better netizen, since they
# tell dnsmasq to filter out queries which the public DNS cannot
# answer, and which load the servers (especially the root servers)
# unnecessarily. If you have a dial-on-demand link they also stop
# these requests from bringing up the link unnecessarily.

# Never forward plain names (without a dot or domain part)
#dnsmasq_configure_domain_needed: true
# Never forward addresses in the non-routed address spaces.
#dnsmasq_configure_bogus_priv: true
# Uncomment these to enable DNSSEC validation and caching:
# (Requires dnsmasq to be built with DNSSEC option.)
#dnsmasq_configure_conf_file: /usr/share/dnsmasq/trust-anchors.conf
#dnsmasq_configure_dnssec: true

# Replies which are not DNSSEC signed may be legitimate, because the domain
# is unsigned, or may be forgeries. Setting this option tells dnsmasq to
# check that an unsigned reply is OK, by finding a secure proof that a DS 
# record somewhere between the root and the domain does not exist. 
# The cost of setting this is that even queries in unsigned domains will need
# one or more extra DNS queries to verify.
# The cost of setting this is that even queries in unsigned domains will need
# one or more extra DNS queries to verify.

#dnsmasq_configure_dnssec_check_unsigned: true
# Uncomment this to filter useless windows-originated DNS requests
# which can trigger dial-on-demand links needlessly.
# Note that (amongst other things) this blocks all SRV requests,
# so don't use it if you use eg Kerberos, SIP, XMMP or Google-talk.
# This option only affects forwarding, SRV records originating for
# dnsmasq (via srv-host= lines) are not suppressed by it.
#dnsmasq_configure_filterwin2k: true

# Change this line if you want dns to get its upstream servers from
# somewhere other that /etc/resolv.conf
#dnsmasq_configure_resolv_file=/etc/foo/resolv.conf

# By  default,  dnsmasq  will  send queries to any of the upstream
# servers it knows about and tries to favour servers to are known
# to be up. Uncommenting this forces dnsmasq to try each query
# with each server strictly in the order they appear in
# /etc/resolv.conf
#dnsmasq_configure_strict_order: true

# If you don't want dnsmasq to read /etc/resolv.conf or any other
# file, getting its servers from this file instead (see below), then
# uncomment this.
#dnsmasq_configure_no_resolv: true
# If you don't want dnsmasq to poll /etc/resolv.conf or other resolv
# files for changes and re-read them then uncomment this.
#dnsmasq_configure_no-poll: true

# Add other name servers here, with domain specs if they are for
# non-public domains.
#dnsmasq_configure_servers:
#  # Forward all queries for the .corp domain to an internal DNS server
#  - domain: corp.example.com
#    ip: 10.0.0.5
#  # Forward all other queries to public DNS servers
#  - ip: 8.8.8.8
#  - ip: 1.1.1.1

# configure reverse servers
#dnsmasq_configure_rev_servers:
#  # Send all address->name queries for 192.168.3.0/24 to nameserver 10.1.2.3
#  - subnet: 192.168.3.0/24
#    nameserver: 10.1.2.3

# Add local-only domains here. Queries in these domains are answered
# from /etc/hosts or DHCP only, and are never forwarded to upstream DNS servers.
# This is useful for preventing DNS rebind attacks or for local development.
#dnsmasq_configure_locals:
#  - mylocaldomain.lan
#  - anotherlocal.dev

# Add domains which you want to force to an IP address here.
# This is useful for setting up local development domains or for basic ad-blocking.
# The variable can be a dictionary (domain: ip) or a list of dictionaries
# with 'domain' and 'ip' keys.
#
# dnsmasq_configure_addresses:
#   # Dictionary format for simple cases:
#   dev.local: 127.0.0.1
#   project.local: 127.0.0.1
#
#   # List format for more complex cases (e.g., generated from other variables):
#   # - domain: 'adserver.com'
#   #   ip: '0.0.0.0'
#   # - domain: 'tracker.com'
#   #   ip: '0.0.0.0'

# --address (and --server) work with IPv6 addresses too.
#dnsmasq_configure_addresses:
#  www.thekelleys.org.uk: 'fe80::20d:60ff:fe36:f83'

# Add the IPs of all queries to specified domains to ipsets.
# This is useful for firewalling or traffic shaping based on domain names.
#dnsmasq_configure_ipsets:
#  - domains:
#      - adserver.com
#      - tracking.net
#    sets:
#      - adblock
#      - malware
#  - domains:
#      - streaming.example.com
#    sets:
#      - high-priority-traffic

# You can control how dnsmasq talks to specific upstream servers.
# This can be used to force queries to be routed via a specific interface
# or to use a specific source IP address and port.
#dnsmasq_configure_talks:
#  # Route queries for 10.1.2.3 via the 'eth1' interface
#  - server: 10.1.2.3
#    target: eth1
#  # Use 192.168.1.1:55 as the source address/port when talking to 10.1.2.3
#  - server: 10.1.2.3
#    target: 192.168.1.1
#    port: 55

# If you want dnsmasq to change uid and gid to something other
# than the default, edit the following lines.
#dnsmasq_configure_user: dnsmasq
#dnsmasq_configure_group: dnsmasq

# If you want dnsmasq to listen for DHCP and DNS requests only on
# specified interfaces (and the loopback) give the name of the
# interface (eg eth0) here. Repeat the line for more than one interface.
#dnsmasq_configure_interfaces:
#  - eth0
#  - eth1

# Or you can specify which interface _not_ to listen on
#dnsmasq_configure_except_interfaces:
#  - wlan0

# Or which to listen on by address (remember to include 127.0.0.1 if
# you use this.)
#dnsmasq_configure_listen_addresses:
#  - 127.0.0.1
#  - 192.168.1.1
#  - ::1

# If you want dnsmasq to provide only DNS service on an interface,
# configure it as shown above, and then use the following line to
# disable DHCP and TFTP on it.
#dnsmasq_configure_no_dhcp_interfaces:
#  - eth0

# On systems which support it, dnsmasq binds the wildcard address,
# even when it is listening on only some interfaces. It then discards
# requests that it shouldn't reply to. This has the advantage of
# working even when interfaces come and go and change address. If you
# want dnsmasq to really bind only the interfaces it is listening on,
# uncomment this option. About the only time you may need this is when
# running another nameserver on the same machine.
#dnsmasq_configure_bind_interfaces: true

# If you don't want dnsmasq to read /etc/hosts, uncomment the
# following line.
#dnsmasq_configure_no_hosts: true
# Or if you want it to read another file, as well as /etc/hosts, use
# this. This is useful for adding custom host entries or blocklists.
#dnsmasq_configure_addn_hosts:
#  - /etc/dnsmasq.d/custom_hosts
#  - /etc/dnsmasq.d/ad_block_hosts

# Set this (and domain: see below) if you want to have a domain
# automatically added to simple names in a hosts-file. This is useful
# for local network resolution.
#dnsmasq_configure_expand_hosts: true

# Set the domain for dnsmasq. This is optional, but if it is set, it
# does the following things:
# 1) Allows DHCP hosts to have fully qualified domain names, as long
#     as the domain part matches this setting.
# 2) Sets the "domain" DHCP option thereby potentially setting the
#    domain of all systems configured by DHCP
# 3) Provides the domain part for "expand-hosts"
#dnsmasq_configure_domains:
#  - domain: mylocal.lan
#  - domain: internal.corp
#    subnet: 10.0.0.0/8
#  - domain: dmz.local
#    range:
#      from: 192.168.100.10
#      to: 192.168.100.200

# Uncomment this to enable the integrated DHCP server, you need
# to supply the range of addresses available for lease and optionally
# a lease time. If you have more than one network, you will need to
# repeat this for each network on which you want to supply DHCP
# service.
#dnsmasq_configure_dhcp_ranges:
#  # IPv4 DHCP range with a 12-hour lease time
#  - range:
#      from: 192.168.1.100
#      to: 192.168.1.200
#    duration: 12h
#
#  # IPv6 DHCP range with a 64-bit prefix and a 24-hour lease time
#  - range:
#      from: 2001:db8::100
#      to: 2001:db8::200
#    prefix: 64
#    duration: 24h
#
#  # Static DHCP range for a specific subnet (no dynamic allocation)
#  - subnet: 192.168.1.0/24
#    static: true
#
#  # DHCPv6 range with Router Advertisements only (no DHCPv6 address assignment)
#  - subnet: 2001:db8::/64
#    ra_only: true
#
#  # DHCPv6 range with Router Advertisements and SLAAC (clients get addresses via SLAAC)
#  - range:
#      from: 2001:db8::10
#      to: 2001:db8::50
#    slaac: True
#
#  # DHCPv6 range with stateless DHCP and RA-names (clients get config, SLAAC addresses, and DNS names)
#  - subnet: 2001:db8::/64
#    ra_stateless: true
#    ra_names: True

# Do router advertisements for all subnets where we're doing DHCPv6.
# Unless overridden by ra-stateless, ra-names, etc., the router
# advertisements will have the M and O bits set, so that clients
# get addresses and configuration from DHCPv6, and the A bit reset,
# so the clients don't use SLAAC addresses.
#dnsmasq_configure_enable_ra: true

# Supply parameters for specified hosts using DHCP. There are lots
# of valid alternatives, so we will give examples of each. Note that
# IP addresses DO NOT have to be in the range given above, they just
# need to be on the same network. The order of the parameters in these
# do not matter, it's permissible to give name, address and MAC in any
# order.
#dnsmasq_configure_dhcp_hosts:
#  # Assign a static IP to a specific MAC address
#  - mac: 00:11:22:33:44:55
#    address: 192.168.1.100
#
#  # Assign a static IP and hostname to a specific MAC address
#  - mac: 00:11:22:33:44:66
#    host: myprinter
#    address: 192.168.1.101
#
#  # Assign an infinite lease to a host by hostname
#  - mac: mydevice
#    address: 192.168.1.102
#    infinite: true
#
#  # Ignore a specific MAC address (do not offer DHCP service)
#  - mac: 00:11:22:33:44:77
#    ignore: true
#
#  # Assign a fixed IPv6 address to a client by DUID
#  - mac: id:00:01:00:01:16:d2:83:fc:92:d4:19:e2:d8:b2
#    ipv6: '[2001:db8::10]'

# Ignore any clients which are not specified in dhcp-host lines
# or /etc/ethers. Equivalent to ISC "deny unknown-clients".
# This relies on the special "known" tag which is set when
# a host is matched.
#dnsmasq_configure_dhcp_ignore_tag: !known

# Send extra options which are tagged based on DHCP vendor class.
#dnsmasq_configure_dhcp_vendor_classes:
#  - set: linux-clients
#    includes: Linux
#  - set: windows-clients
#    includes: MSFT

# Send extra options which are tagged based on DHCP user class.
#dnsmasq_configure_dhcp_user_classes:
#  - set: guest-network
#    includes: guest

# Send extra options which are tagged based on MAC address patterns.
#dnsmasq_configure_dhcp_macs:
#  - set: old-devices
#    mac_pattern: '00:11:22:*:*:*'

# If this line is uncommented, dnsmasq will read /etc/ethers and act
# on the ethernet-address/IP pairs found there just as if they had
# been given as --dhcp-host options. Useful if you keep
# MAC-address/host mappings there for other purposes.
#dnsmasq_configure_read_ethers: true

# Send options to hosts which ask for a DHCP lease.
# See RFC 2132 for details of available options.
# Common options can be given to dnsmasq by name:
# run "dnsmasq --help dhcp" to get a list.
# Note that all the common settings, such as netmask and
# broadcast address, DNS server and default route, are given
# sane defaults by dnsmasq. You very likely will not need
# any dhcp-options. If you use Windows clients and Samba, there
# are some options which are recommended, they are detailed at the
# end of this section.
#dnsmasq_configure_dhcp_options:
#  # Set the default router (gateway) for clients
#  - opt: option:router
#    val: 192.168.1.1
#
#  # Set DNS servers for clients
#  - opt: option:dns-server
#    vals:
#      - 192.168.1.1
#      - 8.8.8.8
#
#  # Set NTP servers for clients
#  - opt: option:ntp-server
#    vals:
#      - 192.168.1.10
#      - 192.168.1.11
#
#  # Force a specific option to be sent (e.g., for PXE clients)
#  - force: true
#    opt: 209 # PXELinux config file
#    val: pxelinux.cfg/default
#
#  # Vendor-specific option for PXE clients
#  - opt: vendor:PXEClient
#    vals:
#      - 1 # PXE option 1 (PXE_BOOT_MENU)
#      - 0.0.0.0 # PXE_BOOT_MENU_SERVER_IP

# Set the boot filename for netboot/PXE. You will only need
# this if you want to boot machines over the network and you will need
# a TFTP server; either dnsmasq's built-in TFTP server or an
# external one. (See below for how to enable the TFTP server.)
#dnsmasq_configure_dhcp_boots:
#  # Basic PXE boot file
#  - file: pxelinux.0
#
#  # PXE boot with a specific TFTP server
#  - file: undionly.kpxe
#    tftp_servername: 192.168.1.200
#
#  # PXE boot with tags (e.g., for different architectures)
#  - tag: x86_64
#    file: grubx64.efi
#  - tag: i386
#    file: grubia32.efi

# Match clients based on various criteria (e.g., vendor class, architecture).
# This is useful for applying specific DHCP options or boot files to certain clients.
#dnsmasq_configure_dhcp_matches:
#  # Match clients with a specific vendor class
#  - set: ipxe
#    opt: 60
#    val: iPXE
#
#  # Match clients based on PXE client architecture (option 93)
#  - set: x86_64_efi
#    opt: option:client-arch
#    val: 7 # EFI x86-64
#  - set: i386_bios
#    opt: option:client-arch
#    val: 0 # x86-32 BIOS

# Do real PXE, rather than just booting a single file, this is an
# alternative to dhcp-boot.
#dnsmasq_configure_pxe_prompts:
#  # Basic PXE prompt
#  - prompt: "Press F8 for menu."
#
#  # PXE prompt with a 60-second timeout
#  - prompt: "Starting network boot in 60 seconds..."
#    wait: 60

# Available boot services for PXE.
#dnsmasq_configure_pxe_services:
#  # Boot from local disk
#  - id: x86PC
#    name: "Boot from local disk"
#
#  # Install Linux from a TFTP server
#  - id: x86PC
#    name: "Install Linux"
#    image: pxelinux
#    tftp_server: 192.168.1.100
#
#  # Install Windows from a RIS server
#  - id: x86PC
#    name: "Install Windows from RIS server"
#    image: 1 # Special image value for RIS
#    tftp_server: 192.168.1.200

# Enable dnsmasq's built-in TFTP server
#dnsmasq_configure_enable_tftp: true

# Set the root directory for files available via TFTP.
#dnsmasq_configure_tftp_root: /var/lib/tftpboot

# Do not abort if the tftp-root is unavailable (useful for development)
#dnsmasq_configure_tftp_no_fail: true

# Make the TFTP server more secure: with this set, only files owned by
# the user dnsmasq is running as will be sent over the net.
#dnsmasq_configure_tftp_secure: true

# This option stops dnsmasq from negotiating a larger blocksize for TFTP
# transfers. It will slow things down, but may rescue some broken TFTP
# clients.
#dnsmasq_configure_tftp_no_blocksize: true

# Set the limit on DHCP leases, the default is 150
#dnsmasq_configure_dhcp_lease_max: 250

# The DHCP server needs somewhere on disk to keep its lease database.
# This defaults to a sane location, but if you want to change it, use
# the line below.
#dnsmasq_configure_dhcp_leasefile: /var/lib/dnsmasq/dnsmasq.leases

# Set the DHCP server to authoritative mode. In this mode it will barge in
# and take over the lease for any client which broadcasts on the network,
# whether it has a record of the lease or not. This avoids long timeouts
# when a machine wakes up on a new network. DO NOT enable this if there's
# the slightest chance that you might end up accidentally configuring a DHCP
# server for your campus/company accidentally. The ISC server uses
# the same option, and this URL provides more information:
# http://www.isc.org/files/auth.html
#dnsmasq_configure_dhcp_authoritative: true

# Run an executable when a DHCP lease is created or destroyed.
# The arguments sent to the script are "add" or "del",
# then the MAC address, the IP address and finally the hostname
# if there is one.
#dnsmasq_configure_dhcp_script: /etc/dnsmasq.d/dhcp_script.sh

# Set the cachesize here. A larger cache size can improve DNS performance.
#dnsmasq_configure_cache_size: 1000

# If you want to disable negative caching, uncomment this. Negative caching
# stores information about non-existent domains, which can speed up lookups
# for frequently queried non-existent domains.
#dnsmasq_configure_no_negcache: true

# Normally responses which come from /etc/hosts and the DHCP lease
# file have Time-To-Live set as zero, which conventionally means
# do not cache further. If you are happy to trade lower load on the
# server for potentially stale date, you can set a time-to-live (in
# seconds) here.
#dnsmasq_configure_local_ttl: 600 # 10 minutes

# If you want dnsmasq to detect attempts by Verisign to send queries
# to unregistered .com and .net hosts to its sitefinder service and
# have dnsmasq instead return the correct NXDOMAIN response, uncomment
# this line. You can add similar lines to do the same for other
# registries which have implemented wildcard A records.
#dnsmasq_configure_bogus_nxdomain: 64.94.110.11 # Example IP for Verisign SiteFinder

# If you want to fix up DNS results from upstream servers, use the
# alias option. This only works for IPv4.
#dnsmasq_configure_aliases:
#  # Alias 1.2.3.4 to 5.6.7.8
#  - src: 1.2.3.4
#    target: 5.6.7.8
#
#  # Map an IP range (1.2.3.x) to another IP range (5.6.7.x)
#  - src: 1.2.3.0
#    target: 5.6.7.0
#    netmask: 255.255.255.0

# Change these lines if you want dnsmasq to serve MX records.
#dnsmasq_configure_mx_host:
#  # Return an MX record for "maildomain.com" pointing to "mail.maildomain.com" with preference 10
#  record: maildomain.com
#  target: mail.maildomain.com
#  preference: 10

# Set the default target for MX records created using the localmx option.
#dnsmasq_configure_mx_target: mail.maildomain.com

# Return an MX record pointing to the mx-target for all local machines.
#dnsmasq_configure_localmx: true

# Return an MX record pointing to itself for all local machines.
#dnsmasq_configure_selfmx: true

# Change the following lines if you want dnsmasq to serve SRV
# records. These are useful if you want to serve ldap requests for
# Active Directory and other windows-originated DNS requests.
# See RFC 2782.
# You may add multiple srv-host lines.
# The fields are <name>,<target>,<port>,<priority>,<weight>
# If the domain part if missing from the name (so that is just has the
# service and protocol sections) then the domain given by the domain=
# config option is used. (Note that expand-hosts does not need to be
# set for this to work.)
#dnsmasq_configure_srv_hosts:
#  # SRV record for LDAP service
#  - name: _ldap._tcp.example.com
#    target: ldapserver.example.com
#    port: 389
#    priority: 10
#    weight: 100
#
#  # SRV record for a different LDAP server with lower priority
#  - name: _ldap._tcp.example.com
#    target: ldapserver2.example.com
#    port: 389
#    priority: 20
#    weight: 50

# The following line shows how to make dnsmasq serve an arbitrary PTR
# record. This is useful for DNS-SD. (Note that the
# domain-name expansion done for SRV records _does_not
# occur for PTR records.)
#dnsmasq_configure_ptr_records:
#  - name: _http._tcp.dns-sd-services
#    val: "My Web Service._http._tcp.dns-sd-services"

# Change the following lines to enable dnsmasq to serve TXT records.
# These are used for things like SPF and zeroconf. (Note that the
# domain-name expansion done for SRV records _does_not
# occur for TXT records.)
#dnsmasq_configure_txt_records:
#  # SPF record
#  - name: example.com
#    vals:
#      - "v=spf1 a -all"
#
#  # General text record
#  - name: _info.example.com
#    vals:
#      - "location=datacenter1"
#      - "contact=admin@example.com"

# Provide an alias for a "local" DNS name. Note that this _only_ works
# for targets which are names from DHCP or /etc/hosts.
#dnsmasq_configure_cnames:
#  - local: oldserver
#    alias: newserver

# For debugging purposes, log each DNS query as it passes through
# dnsmasq.
#dnsmasq_configure_log_queries: true

# Log lots of extra information about DHCP transactions.
#dnsmasq_configure_log_dhcp: true

# Include another lot of configuration options from specified files.
# This is useful for modularizing your dnsmasq configuration.
#dnsmasq_configure_conf_files:
#  - /etc/dnsmasq.d/custom-dns.conf
#  - /etc/dnsmasq.d/static-leases.conf

# Include all configuration files from specified directories.
# This is a best practice for organizing complex dnsmasq configurations.
#dnsmasq_configure_conf_dirs:
#  # Include all files in /etc/dnsmasq.d
#  - d: /etc/dnsmasq.d
#
#  # Include all files in /etc/dnsmasq.d that end with .conf
#  - d: /etc/dnsmasq.d
#    includes:
#      - .conf
#
#  # Include all files in /etc/dnsmasq.d except those ending in .bak
#  - d: /etc/dnsmasq.d
#    excludes:
#      - .bak

#dnsmasq_configure_dhcp_log: true
